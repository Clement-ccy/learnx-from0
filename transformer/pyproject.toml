[project]
name = "learnx-transformer"
version = "0.1.0"
requires-python = ">=3.10,<3.12"
dependencies = [
    "ipykernel",
    "jupyterlab",
    "matplotlib",
    "numpy<2",
    "torch==2.3.0",
]

[project.optional-dependencies]
translation = [
    "torchtext==0.18.0",
    "torchdata==0.7.1",
    "spacy>=3.7,<4",
    "portalocker>=2",
]
